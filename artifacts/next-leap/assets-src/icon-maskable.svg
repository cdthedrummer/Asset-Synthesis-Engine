<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source for icon-maskable-512.png (manifest purpose:"maskable").
       Authored directly on the 512 grid so there is no transform to get wrong.

       Android's guaranteed-visible region is a centred circle of diameter 80%
       = radius 204.8px from (256,256). Proof this fits:
         content spans x 124..388 (centre 256) and y 128..384 (centre 256)
         farthest point is bar 1's corner arc:
           dist((256,256),(159,163)) + r = 134.4 + 35 = 169.4  <=  204.8   (83%)
         bar 3's corner arc:
           dist((256,256),(146,362)) + r = 152.8 + 22 = 174.8  <=  204.8   (85%)
       So it survives a circle, a squircle and a teardrop mask. -->
  <rect width="512" height="512" fill="#FBF8F3"/>
  <rect x="124" y="128" width="264" height="70" rx="35" fill="#C4451C"/>
  <rect x="124" y="242" width="184" height="52" rx="26" fill="#1C1917"/>
  <rect x="124" y="340" width="114" height="44" rx="22" fill="#A8A29E"/>
</svg>
