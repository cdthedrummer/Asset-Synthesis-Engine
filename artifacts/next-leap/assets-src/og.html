<!doctype html>
<!-- Source for public/og.png (1200x630), rasterised by scripts/icons.mjs.
     This is HTML rather than SVG so the real webfonts render — an SVG <text>
     node with a webfont is a liability in raster pipelines. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Local faces: the CDN is unreachable from the rasteriser, and a card
         that silently falls back to Georgia is worse than no card. -->
    <style>
      @font-face { font-family: 'Fraunces'; font-weight: 600 700; src: url('../src/fonts/fraunces-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 400 700; src: url('../src/fonts/inter-latin.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; src: url('../src/fonts/plex-mono-latin.woff2') format('woff2'); }
    </style>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #FBF8F3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        font-family: 'Inter', sans-serif;
        color: #1C1917;
      }
      .bars { display: flex; flex-direction: column; gap: 14px; margin-bottom: 56px; }
      .bar { border-radius: 999px; }
      .b1 { width: 240px; height: 26px; background: #C4451C; }
      .b2 { width: 168px; height: 20px; background: #1C1917; }
      .b3 { width: 104px; height: 16px; background: #A8A29E; }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-variation-settings: 'SOFT' 40, 'WONK' 0;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      p {
        margin-top: 28px;
        font-size: 34px;
        font-weight: 400;
        line-height: 1.35;
        color: #57534E;
        max-width: 820px;
      }
      .kicker {
        margin-top: 52px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #746B62;
      }
    </style>
  </head>
  <body>
    <div class="bars">
      <div class="bar b1"></div>
      <div class="bar b2"></div>
      <div class="bar b3"></div>
    </div>
    <h1>Shortlist</h1>
    <p>One goal in, a short list out: what to drop, what to start, and the order for the rest.</p>
    <div class="kicker">No account &mdash; the link is yours</div>
  </body>
</html>
