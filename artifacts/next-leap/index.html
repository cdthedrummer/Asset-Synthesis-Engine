<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Three things are load-bearing here:
         - viewport-fit=cover is what makes env(safe-area-inset-*) report real
           numbers on iOS. Without it every inset is 0px, which is why the one
           safe-area usage this app already had was silently a no-op.
         - interactive-widget=resizes-content keeps the interview dock above the
           software keyboard on Chromium. (iOS ignores it — see useKeyboardInset.)
         - maximum-scale was removed: it disabled pinch-zoom, an a11y failure.
           The trade is that iOS now zooms on focus for any input under 16px, so
           every focusable input in the app is >=16px. Don't reintroduce a 15px one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />

    <title>Shortlist</title>
    <meta name="description" content="One goal, one board. Shortlist tells you what to drop, the order for the rest, and gets the first one started." />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="Shortlist" />
    <meta property="og:title" content="Shortlist" />
    <meta property="og:description" content="One goal, one board. What to drop, the order for the rest, and the first one already started." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shortlist" />
    <meta name="twitter:description" content="One goal, one board. What to drop, the order for the rest, and the first one already started." />
    <meta name="twitter:image" content="%BASE_URL%og.png" />

    <!-- %BASE_URL% (Vite's HTML env replacement) becomes /next-leap/ — an
         absolute path. It must NOT be relative: index.html is also served for
         /next-leap/b/<token>, where a relative href resolves against that deep
         path and 404s. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta name="theme-color" content="#FBF8F3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shortlist" />

    <!-- Fonts are self-hosted (src/fonts, generated by scripts/fonts.mjs), so
         there is no render-blocking third-party request here at all, no FOUT
         waiting on a CDN, and the service worker can serve them offline. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
